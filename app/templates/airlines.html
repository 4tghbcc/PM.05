{% extends "base.html" %}
{% block heading %}Авиакомпании{% endblock %}
{% block content %}
<div class="panel">
  <div class="panel-head"><h3>Справочник авиакомпаний</h3></div>
  <div class="panel-body">
    <form method="POST" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div class="field" style="flex:2;margin:0"><label>Название</label><input name="name" required></div>
      <div class="field" style="flex:1;margin:0"><label>Код IATA</label><input name="code" maxlength="3" required></div>
      <button class="btn">Добавить</button>
    </form>
  </div>
  <table>
    <thead><tr><th>ID</th><th>Название</th><th>Код</th><th>Рейсов</th><th>Действия</th></tr></thead>
    <tbody>
    {% for a in items %}
      <tr>
        <td>{{ a.id }}</td><td><b>{{ a.name }}</b></td>
        <td><span class="pill active">{{ a.code }}</span></td>
        <td>{{ a.flights|length }}</td>
        <td><a class="btn danger sm" href="{{ url_for('admin.delete_airline', id=a.id) }}">Удалить</a></td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
