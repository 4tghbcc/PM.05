<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><title>Вход — AeroAdmin</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="logo" style="color:#1a2b4c;margin-bottom:18px"><span class="mark">✈</span> AeroAdmin</div>
    <h2>Вход в панель</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    <form method="POST">
      <div class="field"><label>Логин</label><input name="username" required></div>
      <div class="field"><label>Пароль</label><input name="password" type="password" required></div>
      <button class="btn" style="width:100%">Войти</button>
    </form>
  </div>
</body>
</html>
